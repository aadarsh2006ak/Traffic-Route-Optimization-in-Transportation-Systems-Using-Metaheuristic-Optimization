services:
  # ==========================================================
  # 1. FastAPI Python Backend Web Service
  # ==========================================================
  - type: web
    name: quantum-route-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: OSRM_BASE_URL
        value: http://router.project-osrm.org

  # ==========================================================
  # 2. React + Vite Frontend Static Site
  # ==========================================================
  - type: static
    name: quantum-route-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://quantum-route-backend.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://quantum-route-backend.onrender.com/ws/optimize
